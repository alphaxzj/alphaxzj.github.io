<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系模拟器 - 3D交互式体验</title>
    <style>
        :root {
            --bg-dark: #000011;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --panel-border: rgba(100, 150, 255, 0.3);
            --text-color: #d0e0ff;
            --accent-color: #ffcc44;
            --accent-hover: #ffdd66;
            --button-bg: rgba(40, 60, 120, 0.6);
            --button-hover: rgba(60, 90, 180, 0.8);
            --slider-track: rgba(60, 80, 140, 0.5);
            --slider-fill: #ffcc44;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            height: 100vh;
            width: 100vw;
            touch-action: none;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }

        #container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #container canvas {
            display: block;
        }

        /* CSS2D 标签渲染器 */
        #label-renderer {
            position: absolute !important;
            top: 0;
            left: 0;
            pointer-events: none !important;
            z-index: 10;
        }

        /* 行星标签样式 */
        .planet-label {
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 10px;
            background: rgba(20, 30, 50, 0.7);
            border: 1px solid rgba(150, 180, 255, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            white-space: nowrap;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .planet-label.sun-label {
            background: rgba(180, 120, 20, 0.75);
            border-color: rgba(255, 200, 80, 0.6);
            font-size: 13px;
            color: #ffe8a0;
            text-shadow: 0 0 10px rgba(255, 180, 50, 0.8);
        }
        .planet-label.moon-label {
            font-size: 9px;
            background: rgba(60, 60, 70, 0.6);
            border-color: rgba(180, 180, 200, 0.3);
            padding: 2px 7px;
        }

        /* 信息提示 */
        #info-tooltip {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 20;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 90vw;
        }
        #info-tooltip.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 控制面板 */
        #control-panel {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 12px 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .ctrl-btn {
            background: var(--button-bg);
            border: 1px solid rgba(120, 160, 240, 0.4);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
            min-width: 44px;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .ctrl-btn:hover {
            background: var(--button-hover);
            border-color: rgba(160, 200, 255, 0.6);
            color: #ffffff;
            transform: translateY(-1px);
        }
        .ctrl-btn:active {
            transform: translateY(1px) scale(0.97);
            transition-duration: 0.1s;
        }
        .ctrl-btn.active {
            background: rgba(80, 120, 200, 0.7);
            border-color: var(--accent-color);
            color: var(--accent-hover);
            box-shadow: 0 0 12px rgba(255, 204, 68, 0.3);
        }
        .ctrl-btn.reset-btn {
            background: rgba(180, 60, 40, 0.5);
            border-color: rgba(220, 100, 80, 0.5);
        }
        .ctrl-btn.reset-btn:hover {
            background: rgba(200, 70, 50, 0.7);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 140px;
        }
        .slider-container label {
            font-size: 12px;
            color: var(--text-color);
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: var(--slider-track);
            outline: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--slider-fill);
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 204, 68, 0.5);
            transition: transform 0.2s;
        }
        .speed-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        .speed-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--slider-fill);
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 204, 68, 0.5);
        }
        .speed-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-color);
            min-width: 36px;
            text-align: center;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            #control-panel {
                bottom: 12px;
                padding: 8px 12px;
                gap: 6px;
                border-radius: 16px;
            }
            .ctrl-btn {
                padding: 6px 10px;
                font-size: 11px;
                min-width: 36px;
                min-height: 32px;
                border-radius: 10px;
            }
            .slider-container {
                min-width: 100px;
                gap: 6px;
            }
            .speed-slider {
                width: 80px;
            }
            .slider-container label {
                font-size: 10px;
            }
            .speed-value {
                font-size: 11px;
                min-width: 28px;
            }
            .planet-label {
                font-size: 9px;
                padding: 2px 7px;
                border-radius: 8px;
            }
            .planet-label.sun-label {
                font-size: 11px;
            }
            #info-tooltip {
                bottom: 70px;
                font-size: 11px;
                padding: 8px 14px;
                border-radius: 16px;
            }
        }
        @media (max-width: 480px) {
            #control-panel {
                gap: 4px;
                padding: 6px 8px;
            }
            .ctrl-btn {
                padding: 5px 8px;
                font-size: 10px;
                min-width: 32px;
                min-height: 28px;
            }
            .speed-slider {
                width: 60px;
            }
            .speed-value {
                font-size: 10px;
                min-width: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- 3D渲染容器 -->
    <div id="container"></div>

    <!-- CSS2D标签渲染器 -->
    <div id="label-renderer"></div>

    <!-- 信息提示 -->
    <div id="info-tooltip">🌌 太阳系模拟器已启动 — 拖拽旋转 | 滚轮缩放 | 右键平移</div>

    <!-- 控制面板 -->
    <div id="control-panel">
        <button class="ctrl-btn" id="btn-pause" title="暂停/播放动画">⏸️ 暂停</button>
        <button class="ctrl-btn active" id="btn-orbits" title="显示/隐藏轨道">🪐 轨道</button>
        <button class="ctrl-btn active" id="btn-labels" title="显示/隐藏标签">🏷️ 标签</button>
        <div class="slider-container">
            <label>⏱️ 速度</label>
            <input type="range" class="speed-slider" id="speed-slider" min="0" max="3" step="0.05" value="1">
            <span class="speed-value" id="speed-display">1.0x</span>
        </div>
        <button class="ctrl-btn reset-btn" id="btn-reset" title="重置视角">🔄 重置</button>
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ==================== 全局状态 ====================
        const state = {
            isPaused: false,
            showOrbits: true,
            showLabels: true,
            speedMultiplier: 1.0,
            animationTime: 0,
        };

        // ==================== 场景初始化 ====================
        const container = document.getElementById('container');
        const labelContainer = document.getElementById('label-renderer');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000011);
        scene.fog = new THREE.Fog(0x000011, 80, 220);

        // 主渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // CSS2D 标签渲染器
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        labelRenderer.domElement.style.zIndex = '10';
        labelContainer.appendChild(labelRenderer.domElement);

        // 相机
        const camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.1,
            500
        );
        camera.position.set(25, 35, 55);
        camera.lookAt(0, 0, 0);

        // OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 7;
        controls.maxDistance = 180;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.minPolarAngle = Math.PI * 0.08;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.3;
        controls.update();

        // ==================== 光照系统 ====================
        // 环境光 - 提供基础照明
        const ambientLight = new THREE.AmbientLight(0x334466, 0.6);
        scene.add(ambientLight);

        // 太阳点光源 - 主要光源
        const sunLight = new THREE.PointLight(0xffeedd, 2.5, 120, 1.2);
        sunLight.position.set(0, 0, 0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 150;
        sunLight.shadow.bias = -0.0001;
        scene.add(sunLight);

        // 补充的平行光，模拟太阳光
        const directionalLight = new THREE.DirectionalLight(0xfff5e0, 0.6);
        directionalLight.position.set(20, 30, 10);
        directionalLight.castShadow = false;
        scene.add(directionalLight);

        // 半球光
        const hemisphereLight = new THREE.HemisphereLight(0x223355, 0x110022, 0.4);
        scene.add(hemisphereLight);

        // ==================== 星空背景 ====================
        function createStarfield() {
            const starCount = window.innerWidth < 768 ? 1800 : 4000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                const radius = 60 + Math.random() * 140;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);

                const colorChoice = Math.random();
                if (colorChoice < 0.15) {
                    colors[i * 3] = 0.8;
                    colors[i * 3 + 1] = 0.85;
                    colors[i * 3 + 2] = 1.0;
                } else if (colorChoice < 0.3) {
                    colors[i * 3] = 1.0;
                    colors[i * 3 + 1] = 0.9;
                    colors[i * 3 + 2] = 0.7;
                } else if (colorChoice < 0.4) {
                    colors[i * 3] = 1.0;
                    colors[i * 3 + 1] = 0.7;
                    colors[i * 3 + 2] = 0.6;
                } else {
                    const brightness = 0.5 + Math.random() * 0.5;
                    colors[i * 3] = brightness;
                    colors[i * 3 + 1] = brightness;
                    colors[i * 3 + 2] = brightness;
                }

                sizes[i] = 0.3 + Math.random() * 0.8;
            }

            const starGeometry = new THREE.BufferGeometry();
            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const starMaterial = new THREE.PointsMaterial({
                size: 0.35,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const stars = new THREE.Points(starGeometry, starMaterial);
            stars.name = 'starfield';
            return stars;
        }
        scene.add(createStarfield());

        // ==================== 太阳 ====================
        const sunRadius = 4;
        const sunGroup = new THREE.Group();
        sunGroup.name = 'Sun';

        // 太阳球体
        const sunGeometry = new THREE.SphereGeometry(sunRadius, 64, 64);
        const sunMaterial = new THREE.MeshBasicMaterial({
            color: 0xFDB813,
        });
        const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
        sunMesh.name = 'SunMesh';
        sunGroup.add(sunMesh);

        // 太阳内光晕
        const innerGlowGeometry = new THREE.SphereGeometry(sunRadius * 1.15, 48, 48);
        const innerGlowMaterial = new THREE.MeshBasicMaterial({
            color: 0xFFCC44,
            transparent: true,
            opacity: 0.25,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const innerGlow = new THREE.Mesh(innerGlowGeometry, innerGlowMaterial);
        sunGroup.add(innerGlow);

        // 太阳外光晕（Sprite）
        function createSunGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            gradient.addColorStop(0, 'rgba(255, 240, 180, 1)');
            gradient.addColorStop(0.1, 'rgba(255, 210, 100, 0.85)');
            gradient.addColorStop(0.3, 'rgba(255, 170, 50, 0.4)');
            gradient.addColorStop(0.55, 'rgba(255, 120, 20, 0.12)');
            gradient.addColorStop(0.8, 'rgba(255, 80, 10, 0.03)');
            gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        const sunGlowTexture = createSunGlowTexture();
        const sunGlowMaterial = new THREE.SpriteMaterial({
            map: sunGlowTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.9,
        });
        const sunGlowSprite = new THREE.Sprite(sunGlowMaterial);
        sunGlowSprite.scale.set(sunRadius * 6, sunRadius * 6, 1);
        sunGlowSprite.name = 'SunGlow';
        sunGroup.add(sunGlowSprite);

        scene.add(sunGroup);

        // 太阳标签
        const sunLabelDiv = document.createElement('div');
        sunLabelDiv.className = 'planet-label sun-label';
        sunLabelDiv.textContent = '☀️ 太阳';
        const sunLabel = new CSS2DObject(sunLabelDiv);
        sunLabel.position.set(0, sunRadius + 1.5, 0);
        sunGroup.add(sunLabel);

        // ==================== 行星数据 ====================
        const planetData = [{
            name: '水星',
            nameEn: 'Mercury',
            color: 0xB5B5B5,
            radius: 0.35,
            orbitRadius: 7,
            orbitalSpeed: 0.55,
            rotationSpeed: 0.02,
            initialAngle: 0,
            roughness: 0.7,
            metalness: 0.2,
        }, {
            name: '金星',
            nameEn: 'Venus',
            color: 0xE8CDA0,
            radius: 0.65,
            orbitRadius: 10.5,
            orbitalSpeed: 0.38,
            rotationSpeed: 0.015,
            initialAngle: Math.PI * 0.75,
            roughness: 0.6,
            metalness: 0.1,
        }, {
            name: '地球',
            nameEn: 'Earth',
            color: 0x4B8BBE,
            radius: 0.7,
            orbitRadius: 14.5,
            orbitalSpeed: 0.28,
            rotationSpeed: 0.04,
            initialAngle: Math.PI * 1.4,
            roughness: 0.55,
            metalness: 0.05,
            hasMoon: true,
        }, {
            name: '火星',
            nameEn: 'Mars',
            color: 0xC1440E,
            radius: 0.45,
            orbitRadius: 18.5,
            orbitalSpeed: 0.22,
            rotationSpeed: 0.035,
            initialAngle: Math.PI * 2.1,
            roughness: 0.65,
            metalness: 0.15,
        }, {
            name: '木星',
            nameEn: 'Jupiter',
            color: 0xD4A574,
            radius: 2.4,
            orbitRadius: 27,
            orbitalSpeed: 0.11,
            rotationSpeed: 0.08,
            initialAngle: Math.PI * 2.8,
            roughness: 0.5,
            metalness: 0.05,
        }, {
            name: '土星',
            nameEn: 'Saturn',
            color: 0xE8D191,
            radius: 2.0,
            orbitRadius: 36,
            orbitalSpeed: 0.075,
            rotationSpeed: 0.07,
            initialAngle: Math.PI * 3.4,
            roughness: 0.5,
            metalness: 0.05,
            hasRing: true,
        }, {
            name: '天王星',
            nameEn: 'Uranus',
            color: 0x7EC8E3,
            radius: 1.15,
            orbitRadius: 45,
            orbitalSpeed: 0.045,
            rotationSpeed: 0.05,
            initialAngle: Math.PI * 4.0,
            roughness: 0.45,
            metalness: 0.1,
        }, {
            name: '海王星',
            nameEn: 'Neptune',
            color: 0x3B5BA5,
            radius: 1.1,
            orbitRadius: 54,
            orbitalSpeed: 0.032,
            rotationSpeed: 0.045,
            initialAngle: Math.PI * 4.6,
            roughness: 0.45,
            metalness: 0.1,
        }, ];

        // ==================== 创建行星 ====================
        const planets = [];
        const orbitLines = [];
        const orbitLineGroup = new THREE.Group();
        orbitLineGroup.name = 'OrbitLines';
        scene.add(orbitLineGroup);

        function createOrbitLine(radius) {
            const segments = 256;
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(
                    Math.cos(angle) * radius,
                    0,
                    Math.sin(angle) * radius
                ));
            }
            const orbitGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const orbitMaterial = new THREE.LineBasicMaterial({
                color: 0x8899bb,
                transparent: true,
                opacity: 0.35,
                depthWrite: false,
                linewidth: 1,
            });
            const orbitLine = new THREE.LineLoop(orbitGeometry, orbitMaterial);
            orbitLine.name = `Orbit_${radius}`;
            return orbitLine;
        }

        function createPlanetLabel(name, isMoon = false) {
            const div = document.createElement('div');
            div.className = isMoon ? 'planet-label moon-label' : 'planet-label';
            div.textContent = name;
            return new CSS2DObject(div);
        }

        planetData.forEach((data) => {
            const planetGroup = new THREE.Group();
            planetGroup.name = data.name;

            // 行星网格
            const planetGeometry = new THREE.SphereGeometry(data.radius, 48, 48);
            const planetMaterial = new THREE.MeshStandardMaterial({
                color: data.color,
                roughness: data.roughness,
                metalness: data.metalness,
                envMapIntensity: 0.4,
            });
            const planetMesh = new THREE.Mesh(planetGeometry, planetMaterial);
            planetMesh.castShadow = true;
            planetMesh.receiveShadow = true;
            planetMesh.name = `${data.name}Mesh`;
            planetGroup.add(planetMesh);

            // 土星环
            if (data.hasRing) {
                const ringInnerRadius = data.radius * 1.25;
                const ringOuterRadius = data.radius * 2.2;
                const ringGeometry = new THREE.RingGeometry(ringInnerRadius, ringOuterRadius, 128, 1);
                // 修改UV使环有径向渐变效果
                const pos = ringGeometry.attributes.position;
                const uv = ringGeometry.attributes.uv;
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const z = pos.getZ(i);
                    const dist = Math.sqrt(x * x + z * z);
                    const t = (dist - ringInnerRadius) / (ringOuterRadius - ringInnerRadius);
                    uv.setXY(i, t, 0.5);
                }
                const ringMaterial = new THREE.MeshStandardMaterial({
                    color: 0xD4C090,
                    roughness: 0.6,
                    metalness: 0.2,
                    transparent: true,
                    opacity: 0.75,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                });
                const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
                ringMesh.rotation.x = -Math.PI / 2;
                ringMesh.name = 'SaturnRing';
                ringMesh.receiveShadow = true;
                planetGroup.add(ringMesh);

                // 第二个更淡的环
                const ring2Geometry = new THREE.RingGeometry(
                    data.radius * 1.5,
                    data.radius * 2.6,
                    128,
                    1
                );
                const ring2Material = new THREE.MeshStandardMaterial({
                    color: 0xC8B898,
                    roughness: 0.7,
                    metalness: 0.15,
                    transparent: true,
                    opacity: 0.35,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                });
                const ring2Mesh = new THREE.Mesh(ring2Geometry, ring2Material);
                ring2Mesh.rotation.x = -Math.PI / 2;
                ring2Mesh.name = 'SaturnRingOuter';
                planetGroup.add(ring2Mesh);
            }

            // 月球（仅地球）
            if (data.hasMoon) {
                const moonGroup = new THREE.Group();
                moonGroup.name = 'MoonGroup';

                const moonGeometry = new THREE.SphereGeometry(0.2, 24, 24);
                const moonMaterial = new THREE.MeshStandardMaterial({
                    color: 0xCCCCCC,
                    roughness: 0.85,
                    metalness: 0.05,
                });
                const moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
                moonMesh.castShadow = true;
                moonMesh.receiveShadow = true;
                moonMesh.name = 'MoonMesh';
                moonMesh.position.set(1.6, 0, 0);
                moonGroup.add(moonMesh);

                // 月球标签
                const moonLabel = createPlanetLabel('🌙 月球', true);
                moonLabel.position.set(1.6, 0.4, 0);
                moonGroup.add(moonLabel);

                planetGroup.add(moonGroup);
                planetGroup.userData.moonGroup = moonGroup;
                planetGroup.userData.moonOrbitRadius = 1.6;
                planetGroup.userData.moonOrbitalSpeed = 2.8;
                planetGroup.userData.moonAngle = 0;
            }

            // 行星标签
            const label = createPlanetLabel(`${data.name}`);
            label.position.set(0, data.radius + 0.8, 0);
            planetGroup.add(label);

            // 存储行星数据
            planetGroup.userData = {
                ...planetGroup.userData,
                orbitRadius: data.orbitRadius,
                orbitalSpeed: data.orbitalSpeed,
                rotationSpeed: data.rotationSpeed,
                angle: data.initialAngle,
                radius: data.radius,
                name: data.name,
                nameEn: data.nameEn,
                color: data.color,
            };

            // 设置初始位置
            planetGroup.position.x = Math.cos(data.initialAngle) * data.orbitRadius;
            planetGroup.position.z = Math.sin(data.initialAngle) * data.orbitRadius;

            scene.add(planetGroup);
            planets.push(planetGroup);

            // 创建轨道线
            const orbitLine = createOrbitLine(data.orbitRadius);
            orbitLineGroup.add(orbitLine);
            orbitLines.push(orbitLine);
        });

        // ==================== 小行星带（装饰性） ====================
        function createAsteroidBelt() {
            const count = window.innerWidth < 768 ? 600 : 1500;
            const positions = new Float32Array(count * 3);
            const innerRadius = 21;
            const outerRadius = 24;
            const beltYSpread = 0.8;

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = innerRadius + Math.random() * (outerRadius - innerRadius);
                const y = (Math.random() - 0.5) * beltYSpread;
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = Math.sin(angle) * radius;
            }

            const beltGeometry = new THREE.BufferGeometry();
            beltGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const beltMaterial = new THREE.PointsMaterial({
                size: 0.15,
                color: 0x998877,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            const belt = new THREE.Points(beltGeometry, beltMaterial);
            belt.name = 'AsteroidBelt';
            return belt;
        }
        const asteroidBelt = createAsteroidBelt();
        scene.add(asteroidBelt);

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let elapsedSinceLastFrame = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            if (!state.isPaused) {
                elapsedSinceLastFrame = delta * state.speedMultiplier;
                state.animationTime += elapsedSinceLastFrame;
            } else {
                elapsedSinceLastFrame = 0;
            }

            // 更新行星位置
            planets.forEach((planet) => {
                const ud = planet.userData;
                if (!ud || ud.orbitRadius === undefined) return;

                if (!state.isPaused) {
                    ud.angle += ud.orbitalSpeed * state.speedMultiplier * delta;
                }

                planet.position.x = Math.cos(ud.angle) * ud.orbitRadius;
                planet.position.z = Math.sin(ud.angle) * ud.orbitRadius;

                // 行星自转
                if (planet.children.length > 0) {
                    const mesh = planet.children.find(c => c.name === `${ud.name}Mesh`);
                    if (mesh && !state.isPaused) {
                        mesh.rotation.y += ud.rotationSpeed * state.speedMultiplier * delta * 2;
                    }
                }

                // 月球更新
                if (ud.moonGroup && !state.isPaused) {
                    ud.moonAngle += ud.moonOrbitalSpeed * state.speedMultiplier * delta;
                    const moonGroup = ud.moonGroup;
                    moonGroup.position.x = Math.cos(ud.moonAngle) * ud.moonOrbitRadius;
                    moonGroup.position.z = Math.sin(ud.moonAngle) * ud.moonOrbitRadius;
                    // 月球自转
                    const moonMesh = moonGroup.children.find(c => c.name === 'MoonMesh');
                    if (moonMesh) {
                        moonMesh.rotation.y += 0.06 * state.speedMultiplier * delta;
                    }
                }
            });

            // 小行星带缓慢旋转
            if (!state.isPaused) {
                asteroidBelt.rotation.y += 0.03 * state.speedMultiplier * delta;
            }

            // 太阳自转
            if (!state.isPaused) {
                sunMesh.rotation.y += 0.015 * state.speedMultiplier * delta;
                // 光晕微小的脉动
                const pulse = 1 + Math.sin(state.animationTime * 1.8) * 0.03;
                sunGlowSprite.scale.set(sunRadius * 6 * pulse, sunRadius * 6 * pulse, 1);
                innerGlow.scale.setScalar(1 + Math.sin(state.animationTime * 2.2) * 0.04);
            }

            // 更新控制器
            controls.update();

            // 渲染3D场景
            renderer.render(scene, camera);

            // 渲染CSS标签
            labelRenderer.render(scene, camera);
        }

        // ==================== UI 事件处理 ====================
        const btnPause = document.getElementById('btn-pause');
        const btnOrbits = document.getElementById('btn-orbits');
        const btnLabels = document.getElementById('btn-labels');
        const btnReset = document.getElementById('btn-reset');
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        const infoTooltip = document.getElementById('info-tooltip');

        // 暂停/播放
        btnPause.addEventListener('click', () => {
            state.isPaused = !state.isPaused;
            btnPause.textContent = state.isPaused ? '▶️ 播放' : '⏸️ 暂停';
            btnPause.classList.toggle('active', state.isPaused);
            showTooltip(state.isPaused ? '⏸️ 动画已暂停' : '▶️ 动画继续播放');
        });

        // 轨道切换
        btnOrbits.addEventListener('click', () => {
            state.showOrbits = !state.showOrbits;
            orbitLineGroup.visible = state.showOrbits;
            btnOrbits.classList.toggle('active', state.showOrbits);
            showTooltip(state.showOrbits ? '🪐 轨道已显示' : '🪐 轨道已隐藏');
        });

        // 标签切换
        btnLabels.addEventListener('click', () => {
            state.showLabels = !state.showLabels;
            // 遍历所有行星标签
            planets.forEach((planet) => {
                planet.children.forEach((child) => {
                    if (child.isCSS2DObject) {
                        child.visible = state.showLabels;
                    }
                });
            });
            // 太阳标签
            sunGroup.children.forEach((child) => {
                if (child.isCSS2DObject) {
                    child.visible = state.showLabels;
                }
            });
            btnLabels.classList.toggle('active', state.showLabels);
            showTooltip(state.showLabels ? '🏷️ 标签已显示' : '🏷️ 标签已隐藏');
        });

        // 重置视角
        btnReset.addEventListener('click', () => {
            camera.position.set(25, 35, 55);
            controls.target.set(0, 0, 0);
            controls.update();
            showTooltip('🔄 视角已重置');
        });

        // 速度控制
        speedSlider.addEventListener('input', (e) => {
            state.speedMultiplier = parseFloat(e.target.value);
            speedDisplay.textContent = state.speedMultiplier.toFixed(1) + 'x';
        });

        // 键盘快捷键
        window.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case ' ':
                    e.preventDefault();
                    btnPause.click();
                    break;
                case 'o':
                    btnOrbits.click();
                    break;
                case 'l':
                    btnLabels.click();
                    break;
                case 'r':
                    btnReset.click();
                    break;
                case '+':
                case '=':
                    e.preventDefault();
                    speedSlider.value = Math.min(3, parseFloat(speedSlider.value) + 0.1);
                    speedSlider.dispatchEvent(new Event('input'));
                    break;
                case '-':
                    e.preventDefault();
                    speedSlider.value = Math.max(0, parseFloat(speedSlider.value) - 0.1);
                    speedSlider.dispatchEvent(new Event('input'));
                    break;
            }
        });

        // 信息提示
        let tooltipTimeout;

        function showTooltip(message) {
            infoTooltip.textContent = message;
            infoTooltip.classList.add('visible');
            clearTimeout(tooltipTimeout);
            tooltipTimeout = setTimeout(() => {
                infoTooltip.classList.remove('visible');
            }, 2200);
        }

        // 初始提示
        setTimeout(() => {
            showTooltip('🌌 太阳系模拟器已启动 — 拖拽旋转 | 滚轮缩放 | 右键平移');
        }, 600);

        // ==================== 窗口大小调整 ====================
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', onWindowResize);

        // 处理移动端方向变化
        window.addEventListener('orientationchange', () => {
            setTimeout(onWindowResize, 300);
        });

        // ==================== 可见性变化处理 ====================
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clock.stop();
            } else {
                clock.start();
            }
        });

        // ==================== 启动 ====================
        clock.start();
        animate();

        // 初始显示轨道和标签
        orbitLineGroup.visible = state.showOrbits;
        btnOrbits.classList.add('active');
        btnLabels.classList.add('active');

        // 确保所有CSS2DObject初始可见
        planets.forEach((planet) => {
            planet.children.forEach((child) => {
                if (child.isCSS2DObject) {
                    child.visible = state.showLabels;
                }
            });
        });
        sunGroup.children.forEach((child) => {
            if (child.isCSS2DObject) {
                child.visible = state.showLabels;
            }
        });

        console.log('🌌 太阳系模拟器已启动！');
        console.log('📋 控制快捷键：空格=暂停 | O=轨道 | L=标签 | R=重置 | +/-=速度');
        console.log('🖱️ 鼠标操作：拖拽旋转 | 滚轮缩放 | 右键平移');

        // 性能监控（开发用）
        let frameCount = 0;
        let lastFpsCheck = performance.now();
        setInterval(() => {
            const now = performance.now();
            const fps = Math.round((frameCount * 1000) / (now - lastFpsCheck));
            frameCount = 0;
            lastFpsCheck = now;
            if (fps < 30) {
                console.warn(`⚠️ 帧率较低: ${fps} FPS, 考虑降低设备像素比或减少粒子数量`);
            }
        }, 5000);

        // 重写requestAnimationFrame以计数
        const originalRAF = window.requestAnimationFrame;
        window.requestAnimationFrame = function(callback) {
            frameCount++;
            return originalRAF(callback);
        };

        console.log('✅ 所有系统就绪，开始探索太阳系吧！');
    </script>
</body>
</html>
